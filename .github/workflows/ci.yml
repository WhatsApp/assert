name: CI
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
        otp-version: [27, 28, 29]
        include:
          - otp-version: 27
            rebar3-version: 3.24.0
          - otp-version: 28
            rebar3-version: 3.27.0
          - otp-version: 29
            rebar3-version: 3.27.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp-version}}
          rebar3-version: ${{matrix.rebar3-version}}
      - name: Cache Hex packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3/hex/hexpm/packages
          key: ${{ runner.os }}-hex-${{ hashFiles(format('{0}{1}', github.workspace, '/rebar.lock')) }}
          restore-keys: |
            ${{ runner.os }}-hex-
      - name: Compile
        run: rebar3 compile
      - name: Test
        run: rebar3 ct
      - name: Format
        run: rebar3 fmt --check
      - name: XRef
        run: rebar3 xref
      - name: Cache Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3/rebar3_*.plt
          key: ${{ runner.os }}-otp-${{ matrix.otp-version }}-dialyzer-${{ hashFiles(format('{0}{1}', github.workspace, '/rebar.config')) }}
          restore-keys: |
            ${{ runner.os }}-otp-${{ matrix.otp-version }}-dialyzer-
      - name: Dialyzer
        run: rebar3 dialyzer
